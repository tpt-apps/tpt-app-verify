[package]
name = "tpt-verify-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line front end for the TPT Verify engine — analyze a .rs file and exit non-zero on findings, for CI/pre-commit use."
publish = false

[[bin]]
name = "tpt-verify"
path = "src/main.rs"

[features]
default = []
# Pro edition: real interval-based range/overflow checking, plus this
# binary's own `--pdf` report flag (mirrors the free/Pro split of the
# browser/desktop editions).
pro = ["tpt-verify-engine/pro"]

[dependencies]
tpt-verify-engine = { path = "../engine" }
